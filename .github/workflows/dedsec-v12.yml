name: DedSec V12 MAX firmware build
on:
  push:
    branches:
      - dedsec-ui
    paths:
      - 'radio/**'
      - 'cmake/**'
      - 'tools/**'
      - '.github/workflows/dedsec-v12.yml'
      - 'CMakeLists.txt'
      - '.gitmodules'
  workflow_dispatch:

# Rebuild marker: generated custom font sources.
# Run visual regression tests independently from the firmware compilation.
# Icon-source updates are rendered with firmware mask polarity before this workflow is triggered.
# This keeps genuine image comparison failures visible without preventing
# us from determining whether the V12 firmware itself compiles.
jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[font-source]')
    name: V12 graphical and radio tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/edgetx/edgetx-dev:latest
      volumes:
        - ${{ github.workspace }}:/src
    steps:
      - name: Check out firmware and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test V12 MAX (v12 target)
        env:
          FLAVOR: v12
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: ./tools/commit-tests.sh
      - name: Upload changed graphical-test images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v12-failed-graphical-tests
          path: radio/src/tests/images/color/failed_*.png
          retention-days: 3
          if-no-files-found: ignore

  build:
    # Intentional UI changes can fail screenshot comparisons. Still compile the
    # firmware so the graphical report and a testable artifact are both produced.
    if: always() && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[font-source]'))
    name: Compile V12 MAX firmware
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/edgetx/edgetx-dev:latest
      volumes:
        - ${{ github.workspace }}:/src
    steps:
      - name: Check out firmware and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build V12 MAX firmware (v12 target)
        env:
          FLAVOR: v12
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: ./tools/build-gh.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dedsec-v12-max-firmware
          path: |
            fw.json
            LICENSE
            *.bin
            *.uf2
          retention-days: 15
          if-no-files-found: error
