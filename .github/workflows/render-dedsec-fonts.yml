name: Render DedSec pixel fonts

on:
  push:
    branches: [dedsec-ui]
    paths:
      - '.github/workflows/render-dedsec-fonts.yml'
      - 'radio/src/fonts/DedSecPixel/**'
      - 'radio/src/fonts/lvgl/make_fonts.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dedsec-ui

      - name: Install LVGL font converter
        run: npm install --global lv_font_conv

      - name: Generate firmware font sources
        working-directory: radio/src/fonts/lvgl
        run: ./make_fonts.sh

      - name: Commit generated font sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio/src/fonts/lvgl/sml radio/src/fonts/lvgl/std radio/src/fonts/lvgl/lrg
          git diff --cached --quiet && exit 0
          git commit -m "Render DedSec 5x5 firmware fonts"
          git push
