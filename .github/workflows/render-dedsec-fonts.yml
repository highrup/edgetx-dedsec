name: Render DedSec pixel fonts

on:
  push:
    branches: [dedsec-ui]
    paths:
      - '.github/workflows/render-dedsec-fonts.yml'
      - 'radio/src/fonts/DedSecPixel/**'
      - 'radio/src/fonts/lvgl/make_fonts.sh'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dedsec-ui
          submodules: recursive

      - name: Install LVGL font converter
        run: npm install --global lv_font_conv

      - name: Source Silkscreen Regular from Google Fonts
        shell: bash
        run: |
          mkdir -p radio/src/fonts/DedSecPixel
          rm -f radio/src/fonts/DedSecPixel/Tiny5-Light.ttf \
                radio/src/fonts/DedSecPixel/Tiny5-Regular.ttf
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/silkscreen/Silkscreen-Regular.ttf' \
            --output radio/src/fonts/DedSecPixel/Silkscreen-Regular.ttf
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/Gissio/font_Tiny5/main/fonts/ttf/Tiny5-Regular.ttf' \
            --output radio/src/fonts/DedSecPixel/Tiny5-Regular.ttf
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/silkscreen/OFL.txt' \
            --output radio/src/fonts/DedSecPixel/OFL.txt

      - name: Generate firmware font sources
        working-directory: radio/src/fonts/lvgl
        run: ./make_fonts.sh

      - name: Commit generated font sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A radio/src/fonts/DedSecPixel \
                  radio/src/fonts/lvgl/sml radio/src/fonts/lvgl/std radio/src/fonts/lvgl/lrg
          git diff --cached --quiet && exit 0
          git commit -m "Render Silkscreen firmware fonts"
          git push

      - name: Build firmware with rendered fonts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dedsec-v12.yml --ref dedsec-ui
