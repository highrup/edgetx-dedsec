name: Render all DedSec V12 icon masks
on:
  push:
    branches: [dedsec-ui]
    paths: ['.github/workflows/render-five-menu-icons.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dedsec-ui
      - run: python -m pip install cairosvg pillow
      - name: Render all supplied SVG files as 24x24 mask PNGs
        shell: bash
        run: |
          python - <<'PY'
          import io
          from pathlib import Path
          from PIL import Image
          import cairosvg
          root = Path("radio/src/bitmaps")
          svgs = sorted((root / "img-src").glob("mask_icon_*.svg"))
          svgs.append(root / "img-src" / "mask_menu_favs.svg")
          for svg in svgs:
              stem = svg.stem
              png = root / "320x240" / (stem + ".png")
              pixels = cairosvg.svg2png(url=str(svg), output_width=24, output_height=24)
              rgba = Image.open(io.BytesIO(pixels)).convert("RGBA")
              alpha = rgba.getchannel("A")
              Image.merge("RGB", (alpha, alpha, alpha)).save(png)
              print(stem, png, rgba.size)
          PY
      - name: Commit all rendered V12 icons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio/src/bitmaps/320x240/mask_icon_*.png radio/src/bitmaps/320x240/mask_menu_favs.png
          git diff --cached --quiet && exit 0
          git commit -m "Render five supplied V12 menu icon masks"
          git push
