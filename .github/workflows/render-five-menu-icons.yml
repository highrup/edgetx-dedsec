name: Render five DedSec V12 menu icon masks
on:
  push:
    branches: [dedsec-ui]
    paths: ['.github/workflows/render-five-menu-icons.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dedsec-ui
      - run: python -m pip install cairosvg pillow
      - name: Render user SVG files as existing 24x24 mask PNGs
        shell: bash
        run: |
          python - <<'PY'
          import io
          from pathlib import Path
          from PIL import Image
          import cairosvg
          root = Path("radio/src/bitmaps")
          names = ["ui_setup", "manage_models", "model_setup", "tools", "radio_setup"]
          for name in names:
              stem = "mask_icon_menu_" + name
              svg = root / "img-src" / (stem + ".svg")
              png = root / "320x240" / (stem + ".png")
              pixels = cairosvg.svg2png(url=str(svg), output_width=24, output_height=24)
              rgba = Image.open(io.BytesIO(pixels)).convert("RGBA")
              black = Image.new("RGBA", rgba.size, (0, 0, 0, 255))
              black.alpha_composite(rgba)
              black.convert("RGB").save(png)
              print(stem, png, rgba.size)
          PY
      - name: Commit five V12 icons only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio/src/bitmaps/320x240/mask_icon_menu_{ui_setup,manage_models,model_setup,tools,radio_setup}.png
          git diff --cached --quiet && exit 0
          git commit -m "Render five supplied V12 menu icon masks"
          git push
